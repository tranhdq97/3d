<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    window.__CATALOG_ASSET_BASE__ = (function () {
      var host = location.hostname;
      if (/\.github\.io$/i.test(host)) {
        var parts = location.pathname.split('/').filter(Boolean);
        if (parts[0]) return '/' + parts[0] + '/';
      }
      var path = location.pathname;
      if (/\.html?$/i.test(path)) return path.slice(0, path.lastIndexOf('/') + 1);
      if (path.endsWith('/')) return path;
      if (/^\/[^/]+$/.test(path)) return path + '/';
      return '/';
    })();
  </script>
  <title>Song Ngư Quán - Sản phẩm 3D</title>
  <style>
    body.theme-b { margin: 0; font-family: system-ui, sans-serif; background: #d8d2c6; }
    .site-intro-band { background: #5f6b49; color: #fff; padding: 16px 0 14px; }
    .site-bar { background: #5f6b49; }
    .catalog-loading { text-align: center; padding: 2rem; color: #6b6560; }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <link rel="stylesheet" href="assets/css/catalog.css" id="catalog-css" />
  <script>
    (function () {
      var base = window.__CATALOG_ASSET_BASE__;
      var css = document.getElementById('catalog-css');
      css.href = base + 'assets/css/catalog.css?v=15';
    })();
  </script>
</head>
<body class="theme-b">

  <section class="site-intro-band" id="site-intro">
    <div class="catalog-container">
      <h1 id="site-title">…</h1>
      <p id="site-subtitle">Đang tải danh mục…</p>
    </div>
  </section>

  <header class="site-bar" id="site-bar">
    <div class="catalog-container site-toolbar">
      <nav class="category-nav" aria-label="Danh mục sản phẩm">
        <div class="category-nav-inner" id="category-nav-inner"></div>
      </nav>
    </div>
  </header>

  <div class="catalog-container catalog-main">
    <main id="catalog-root">
      <p class="catalog-loading">Đang tải sản phẩm…</p>
    </main>
  </div>

  <noscript>
    <p style="text-align:center;padding:2rem">Trang cần bật JavaScript để hiển thị danh mục.</p>
  </noscript>

  <script>
    (function () {
      var base = window.__CATALOG_ASSET_BASE__;
      var s = document.createElement('script');
      s.src = base + 'assets/js/catalog.js?v=14';
      s.defer = true;
      s.onerror = function () {
        var root = document.getElementById('catalog-root');
        if (root) {
          root.innerHTML =
            '<div class="catalog-error"><strong>Không tải được catalog.js</strong><p>URL: ' +
            s.src +
            '</p><p>Kiểm tra GitHub Pages đã deploy file assets/js/catalog.js</p></div>';
        }
      };
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
